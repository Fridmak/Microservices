# WasmGate data plane for the Microservices demo.
#
# HTTP/WebSocket edge:
#   client :8080
#     /api/* -> api pool -> gateway:8080
#     /ws*   -> ws pool  -> notifications:8080
#
# PostgreSQL routing:
#   client :5433
#     database=AuthDb          -> auth-db:5432
#     database=TaskDb          -> task-db:5432
#     database=NotificationsDb -> notifications-db:5432
#
# The path_router and pg_router plugins inspect only the first client packet;
# after the pool is selected the connection returns to the zero-copy splice(2)
# path. PostgreSQL clients must use SSL Mode=Disable / sslmode=disable because
# an SSLRequest does not carry a database name.
version: 1

admin_addr: "0.0.0.0:9099"
admin_allow_remote: true
admin_pprof: false

listeners:
  - name: edge
    addr: "0.0.0.0:8080"
    upstream_pool: api
    max_conns: 10000
    dial_timeout: 5s
    idle_timeout: 0s
    rate_limit:
      max: 200
      subnet_max: 1000
      window: 1s
      ban_duration: 5s
    plugin:
      path: "path_router.wasm"
      data_mode: "once"
      timeout: 50ms
      route_pools: ["api", "api", "ws"]

  - name: postgres
    addr: "0.0.0.0:5433"
    upstream_pool: authdb
    max_conns: 400
    dial_timeout: 3s
    idle_timeout: 0s
    rate_limit:
      max: 200
      subnet_max: 1000
      window: 1s
      ban_duration: 5s
    plugin:
      path: "pg_router.wasm"
      max_memory_pages: 32
      data_mode: "once"
      timeout: 50ms
      route_pools: ["authdb", "taskdb", "notificationsdb"]

pools:
  api:
    balance: round_robin
    servers:
      - "gateway:8080"
    health_check:
      interval: 5s
      timeout: 1s
  ws:
    balance: round_robin
    servers:
      - "notifications:8080"
    health_check:
      interval: 5s
      timeout: 1s
  authdb:
    balance: least_conn
    servers:
      - "auth-db:5432"
    health_check:
      interval: 5s
      timeout: 1s
  taskdb:
    balance: least_conn
    servers:
      - "task-db:5432"
    health_check:
      interval: 5s
      timeout: 1s
  notificationsdb:
    balance: least_conn
    servers:
      - "notifications-db:5432"
    health_check:
      interval: 5s
      timeout: 1s
